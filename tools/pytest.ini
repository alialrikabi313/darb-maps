[pytest]
testpaths = tests

# يحتاج pytest-env (في server/requirements.txt). بلاه يُتجاهَل قسم env
# بتحذير صامت فتموت كل الاختبارات برسالة السرّ المفقود.
#
# الاختبارات تستورد server/app/settings.py، وهو يموت بلا سرّ توقيع.
# الفشل المغلق مقصود: نسيان المتغيّر في الإنتاج كان يسقط على سرّ مكتوب
# في الريبو. نعلن وضع التطوير هنا صراحةً بدل ما نُرخي الفحص.
env =
    DARB_DEV=1

filterwarnings =
    error::DeprecationWarning
