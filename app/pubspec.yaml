name: darb
description: تطبيق ملاحة للعراق على بيانات OpenStreetMap
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # محرّك الخريطة. MapLibre الأصلي عبر platform view لا رسم Dart: الكاميرا
  # المائلة التي تدور مع اتجاه السيارة هي قلب تجربة الملاحة، ورسم المتجهات
  # على المعالج يسقط دون 60fps عند أول دوران
  maplibre_gl: ^0.27.1

  # الموقع. geolocator لا location: يعطي سرعة واتجاه GPS مباشرة من الجهاز،
  # وهما أدقّ بكثير من حسابهما بتفاضل موقعين مضطربين
  geolocator: ^14.1.1
  flutter_compass: ^0.8.1

  # خدمة مقدّمة تُبقي الملاحة شغّالة والشاشة مقفلة. أندرويد 14+ يقتل أي
  # خدمة خلفية بلا إشعار دائم، وXiaomi وHuawei يقتلونها أصلاً
  flutter_foreground_task: ^11.0.3
  # مقيّد دون 1.8.1: من 1.8.1 يطلب dbus ^0.8 وgeolocator_linux يطلب ^0.7،
  # فيفشل الحلّ. ما نبني للينكس لكن pub يحلّ كل المنصّات على كل حال
  wakelock_plus: ">=1.2.0 <1.8.1"

  # التوجيه الصوتي العربي
  flutter_tts: ^4.2.5
  vibration: ^3.2.1

  # قاعدة البيانات المحلية: بلاطات الخريطة (mbtiles) وبحث نقاط الاهتمام
  sqflite: ^2.4.4+1
  path_provider: ^2.1.6

  # سيرفر HTTP محلي يقدّم البلاطات لـMapLibre. ليش: MapLibre ما يقرأ
  # mbtiles مباشرة، وتطبيق مواصفة PMTiles الثنائية بيدي مخاطرة بلا مقابل
  shelf: ^1.4.2

  http: ^1.6.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  permission_handler: ^13.0.2
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # نمط الخريطة. يُحمَّل من الأصول لا من الشبكة: التطبيق يشتغل أوفلاين
    - assets/style/
    # ملفات glyph. بلاها تظهر الخريطة بلا أي كتابة ولا رسالة خطأ تقول السبب
    - assets/fonts/Noto Sans Regular/
    - assets/fonts/Noto Sans Bold/
    # حزمة بغداد: البلاطات وقاعدة البحث. تُشحن مع التطبيق ليشتغل من أول
    # تشغيل بلا شبكة؛ باقي المحافظات تُنزَّل من شاشة الأوفلاين
    - assets/data/
